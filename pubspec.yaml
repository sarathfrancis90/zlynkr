name: icos
description: "Icos - one line, every cell. A daily Hamiltonian path puzzle."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.10.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.5

  # Utilities
  connectivity_plus: ^6.1.4
  share_plus: ^10.1.4
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Environment
  flutter_dotenv: ^5.2.1

  # Splash
  flutter_native_splash: ^2.4.6
  confetti: ^0.8.0

  # Audio
  audioplayers: ^6.1.0
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  in_app_review: ^2.0.12
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  firebase_messaging: ^16.6.0
  qr_flutter: ^4.1.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.4
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  # Testing
  mocktail: ^1.0.4
  # App icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A1628"
  android: true
  ios: true
  android_12:
    color: "#0A1628"
    icon_background_color: "#0A1628"

flutter:
  uses-material-design: true

  assets:
    - assets/puzzles/
    - assets/icons/
    - assets/sounds/
    - .env.development
    - .env.production
